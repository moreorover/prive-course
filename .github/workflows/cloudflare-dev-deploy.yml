name: Cloudflare Dev Deploy

on:
  pull_request:

concurrency:
  group: cloudflare-dev-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: cloudflare-dev
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install Dependencies
        run: vp install --frozen-lockfile

      - name: Load Deployment Secrets
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          ALCHEMY_PASSWORD: op://prive-course/prive-course-cloudflare-dev/alchemy/ALCHEMY_PASSWORD
          ALCHEMY_STATE_TOKEN: op://prive-course/prive-course-cloudflare-dev/alchemy/ALCHEMY_STATE_TOKEN
          CLOUDFLARE_ACCOUNT_ID: op://prive-course/prive-course-cloudflare-dev/cloudflare/account-id
          CLOUDFLARE_API_TOKEN: op://prive-course/prive-course-cloudflare-dev/cloudflare/api-token
          CLOUDFLARE_STREAM_API_TOKEN: op://prive-course/prive-course-cloudflare-dev/cloudflare/stream-api-token
          BETTER_AUTH_SECRET: op://prive-course/prive-course-cloudflare-dev/better-auth/BETTER_AUTH_SECRET
          BETTER_AUTH_URL: op://prive-course/prive-course-cloudflare-dev/better-auth/BETTER_AUTH_URL
          CORS_ORIGIN: op://prive-course/prive-course-cloudflare-dev/workers/cors-origin

      - name: Check
        run: vp run check

      - name: Test
        run: vp run test

      - name: Deploy Dev
        run: vp run deploy

name: Cloudflare Prod Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: cloudflare-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: cloudflare-prod
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install Dependencies
        run: vp install --frozen-lockfile

      - name: Load Deployment Secrets
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          ALCHEMY_PASSWORD: op://prive-course/prive-course-cloudflare-prod/alchemy/ALCHEMY_PASSWORD
          ALCHEMY_STATE_TOKEN: op://prive-course/prive-course-cloudflare-prod/alchemy/ALCHEMY_STATE_TOKEN
          CLOUDFLARE_ACCOUNT_ID: op://prive-course/prive-course-cloudflare-prod/cloudflare/account-id
          CLOUDFLARE_API_TOKEN: op://prive-course/prive-course-cloudflare-prod/cloudflare/api-token
          CLOUDFLARE_STREAM_API_TOKEN: op://prive-course/prive-course-cloudflare-prod/cloudflare/stream-api-token
          BETTER_AUTH_SECRET: op://prive-course/prive-course-cloudflare-prod/better-auth/BETTER_AUTH_SECRET
          BETTER_AUTH_URL: op://prive-course/prive-course-cloudflare-prod/better-auth/BETTER_AUTH_URL
          CORS_ORIGIN: op://prive-course/prive-course-cloudflare-prod/workers/cors-origin

      - name: Check
        run: vp run check

      - name: Test
        run: vp run test

      - name: Deploy Prod
        run: vp run deploy:prod
